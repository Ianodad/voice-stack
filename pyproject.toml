[project]
name = "voice-stack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ian Adera", email = "ianodad@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hf-transfer>=0.1.9",
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.5.5",
    "mlx-lm>=0.31.3",
    "parakeet-mlx>=0.5.2",
    "psutil>=7.2.2",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
]

[project.scripts]
voice-stack = "voice_stack:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
